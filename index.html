<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videy Clean White</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: black;
}

.header {
    padding: 15px;
    border-bottom: 1px solid #ddd;
}

.start-screen {
    text-align: center;
    padding: 60px 20px;
}

.start-btn {
    margin-top: 20px;
    background: black;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
}

.video-container {
    display: none;
    width: 100%;
    max-width: 400px;
    margin: 20px auto 80px;
}

video {
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 15px;
    background: black;
}

/* Telegram */
.telegram-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #fff;
    border-top: 1px solid #ddd;
    padding: 10px;
    text-align: center;
    display: none;
}

.telegram-btn {
    background: #0088cc;
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    text-decoration: none;
}

/* Overlay */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.overlay-box {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.overlay-box button {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    background: black;
    color: white;
    border-radius: 20px;
}
</style>
</head>

<body>

<div class="header"><b>videy.co</b></div>

<div class="start-screen" id="startScreen">
    <h2>Lanjutkan Menonton Video?</h2>
    <p>Klik tombol di bawah untuk memulai.</p>
    <button class="start-btn" onclick="startVideo()">▶ Mulai Menonton</button>
</div>

<div class="video-container" id="videoContainer">
    <video id="video" controls controlsList="nodownload">
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
    <div class="overlay-box">
        <p>🔒 Buka bagian paling seru?</p>
        <button onclick="unlockVideo()">Lanjutkan</button>
    </div>
</div>

<!-- Telegram -->
<div class="telegram-bar" id="telegramBar">
    <a href="#" onclick="joinTelegram()" class="telegram-btn">Join Telegram</a>
</div>

<script>
const ADS_LINK = "https://rungbeacon.com/pihwy18d?key=b11979058384d9a9aa9cb5871faa888d";
const TELEGRAM_LINK = "https://t.me/+sqRMacpzi-xlODc1";

let firstAdShown = false;
let secondAdShown = false;

// ▶ Start (Trigger 1 - aman)
function startVideo() {
    if (!firstAdShown) {
        firstAdShown = true;
        window.open(ADS_LINK, "_blank");
    }

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("videoContainer").style.display = "block";

    const video = document.getElementById("video");
    video.play();

    // Overlay muncul (biar penasaran)
    setTimeout(() => {
        document.getElementById("overlay").style.display = "flex";
    }, 6000);

    // Telegram muncul belakangan
    setTimeout(() => {
        document.getElementById("telegramBar").style.display = "block";
    }, 9000);
}

// 🔓 Unlock (Trigger 2 - masih aman)
function unlockVideo() {
    document.getElementById("overlay").style.display = "none";

    if (!secondAdShown) {
        secondAdShown = true;
        window.open(ADS_LINK, "_blank");
    }
}

// 📲 Telegram (tanpa ads biar trust)
function joinTelegram() {
    window.open(TELEGRAM_LINK, "_blank");
}
</script>

</body>
</html>
