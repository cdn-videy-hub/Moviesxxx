<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">

<title>Premium Stream</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(to bottom,#000,#1a0000,#440000);
    color:white;
    overflow-x:hidden;
}

#landing-page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
    linear-gradient(rgba(0,0,0,0.75),rgba(30,0,0,0.9)),
    url('bg.jpg') center/cover no-repeat;
}

.box{
    width:650px;
    text-align:center;
    background:rgba(0,0,0,0.55);
    border:2px solid rgba(255,0,0,0.4);
    padding:55px;
    border-radius:24px;
    backdrop-filter:blur(8px);
    box-shadow:0 0 30px rgba(255,0,0,0.25);
}

.box h1{
    font-size:56px;
    color:#ff3b3b;
    margin-bottom:20px;
}

.box p{
    font-size:20px;
    line-height:1.7;
    color:#ddd;
    margin-bottom:35px;
}

.enter-btn{
    border:none;
    background:#ff2020;
    color:white;
    padding:18px 45px;
    font-size:22px;
    border-radius:14px;
    transition:0.3s;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,0,0,0.5);
}

.enter-btn:hover{
    transform:scale(1.05);
    background:#ff4040;
}

#stream-page{
    display:none;
    padding:20px;
}

.container{
    width:1400px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:25px;
    color:#ff3b3b;
    font-size:42px;
}

.ads-box{
    width:100%;
    min-height:90px;
    margin:20px 0;
    border-radius:14px;
    overflow:hidden;
    background:#111;
    border:1px solid rgba(255,0,0,0.25);
    display:flex;
    justify-content:center;
    align-items:center;
}

.top-videos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

.top-videos video{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid rgba(255,0,0,0.4);
    background:black;
}

.fake-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.fake-card{
    position:relative;
    overflow:hidden;
    border-radius:14px;
    border:2px solid rgba(255,0,0,0.4);
    height:500px;
    cursor:pointer;
    transition:0.3s;
}

.fake-card:hover{
    transform:scale(1.01);
    border-color:#ff3b3b;
}

.fake-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);
}

.play-btn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:85px;
    height:85px;
    background:rgba(255,0,0,0.75);
    border-radius:50%;
    backdrop-filter:blur(5px);
    box-shadow:0 0 20px rgba(255,0,0,0.5);
}

.play-btn::before{
    content:'';
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-40%,-50%);
    border-left:28px solid white;
    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
}

.duration{
    position:absolute;
    bottom:12px;
    right:12px;
    background:rgba(0,0,0,0.8);
    padding:6px 10px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.info{
    position:absolute;
    bottom:12px;
    left:12px;
    display:flex;
    gap:12px;
    font-size:14px;
    font-weight:bold;
}

.views,
.likes{
    background:rgba(0,0,0,0.75);
    padding:6px 10px;
    border-radius:8px;
}

video::-webkit-media-controls-download-button{
    display:none;
}

video::-webkit-media-controls-enclosure{
    overflow:hidden;
}

</style>
</head>
